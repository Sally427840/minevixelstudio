<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minevixel Studio — My Addons</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #1c1c1c; --bg-card: #242424; --border: #333;
  --grass: #5D8A3C; --grass-light: #73A832;
  --diamond: #4AEDD9; --gold: #FFD700;
  --text: #f0f0f0; --text-muted: #888; --text-dim: #4a4a4a;
  --red: #e05252;
}
body { background: var(--bg); color: var(--text); font-family: 'VT323', monospace; min-height: 100vh; display: flex; flex-direction: column; }
nav { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 1.5rem; background: #0f0f0f; border-bottom: 2px solid #252525; position: sticky; top: 0; z-index: 100; }
.nav-logo { font-family: 'Press Start 2P', monospace; font-size: 14px; color: var(--grass-light); text-shadow: 2px 2px 0 #2a4a1a; text-decoration: none; }
.nav-logo span { color: var(--diamond); }
.nav-right { display: flex; align-items: center; gap: 0.75rem; }
.nav-user { font-family: 'VT323', monospace; font-size: 17px; color: var(--text-muted); }
.nav-user span { color: var(--diamond); }
.nav-btn { padding: 5px 10px 6px; font-family: 'Press Start 2P', monospace; font-size: 7px; background: transparent; color: var(--text-muted); border: 2px solid var(--border); cursor: pointer; text-decoration: none; display: inline-block; transition: all 0.15s; }
.nav-btn:hover { border-color: var(--grass); color: var(--grass-light); }
.nav-btn.red:hover { border-color: var(--red); color: var(--red); }
.pixel-divider { width: 100%; height: 4px; background: repeating-linear-gradient(90deg, var(--grass) 0px, var(--grass) 16px, var(--grass-light) 16px, var(--grass-light) 32px, #8B5E3C 32px, #8B5E3C 48px, #333 48px, #333 64px); }
main { flex: 1; padding: 1.5rem; max-width: 1000px; margin: 0 auto; width: 100%; }
.page-title { font-family: 'Press Start 2P', monospace; font-size: clamp(11px, 1.8vw, 15px); color: var(--grass-light); text-shadow: 2px 2px 0 #2a4a1a; margin-bottom: 0.3rem; }
.page-sub { font-family: 'VT323', monospace; font-size: 18px; color: var(--text-muted); margin-bottom: 1.5rem; letter-spacing: 1px; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
.addon-count { font-family: 'VT323', monospace; font-size: 18px; color: var(--text-muted); }
.btn-create { padding: 10px 20px 12px; font-family: 'Press Start 2P', monospace; font-size: 8px; background: var(--grass); color: #fff; border: none; cursor: pointer; text-decoration: none; display: inline-block; box-shadow: 0 3px 0 #2a4a1a; transition: transform 0.1s; }
.btn-create:hover { background: var(--grass-light); transform: translateY(-1px); }
.addons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2px; }
.addon-card { background: var(--bg-card); border: 2px solid var(--border); padding: 1.1rem; transition: border-color 0.2s, transform 0.15s; }
.addon-card:hover { border-color: var(--grass); transform: translateY(-2px); }
.addon-type-icon { font-size: 28px; display: block; margin-bottom: 0.5rem; }
.addon-name { font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--text); margin-bottom: 0.4rem; line-height: 1.6; }
.addon-desc { font-family: 'VT323', monospace; font-size: 16px; color: var(--text-muted); line-height: 1.35; margin-bottom: 0.75rem; }
.addon-meta { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 0.6rem; }
.addon-tag { font-family: 'Press Start 2P', monospace; font-size: 6px; padding: 3px 6px; background: #1a2a1a; border: 1px solid var(--grass); color: var(--grass-light); }
.addon-tag.blue { background: #1a1a2a; border-color: var(--diamond); color: var(--diamond); }
.addon-colors { display: flex; gap: 3px; margin-bottom: 0.6rem; }
.color-dot { width: 16px; height: 16px; border: 1px solid #333; }
.addon-date { font-family: 'VT323', monospace; font-size: 14px; color: var(--text-dim); margin-bottom: 0.75rem; }
.addon-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-bottom: 0.75rem; }
.stat-mini { background: #1a1a1a; border: 1px solid var(--border); padding: 4px; text-align: center; }
.stat-mini-label { font-family: 'Press Start 2P', monospace; font-size: 5px; color: var(--text-dim); display: block; }
.stat-mini-val { font-family: 'Press Start 2P', monospace; font-size: 9px; }
.addon-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.btn-share { padding: 8px 0 10px; font-family: 'Press Start 2P', monospace; font-size: 6px; background: transparent; color: var(--text-muted); border: 2px solid var(--border); cursor: pointer; transition: all 0.15s; }
.btn-share:hover { border-color: var(--grass); color: var(--grass-light); }
.btn-share.shared { background: #1a2a1a; border-color: var(--grass); color: var(--grass-light); }
.btn-delete { padding: 8px 0 10px; font-family: 'Press Start 2P', monospace; font-size: 6px; background: transparent; color: var(--text-muted); border: 2px solid var(--border); cursor: pointer; transition: all 0.15s; }
.btn-delete:hover { border-color: var(--red); color: var(--red); }
.loading-msg { font-family: 'VT323', monospace; font-size: 20px; color: var(--text-muted); padding: 3rem 1rem; text-align: center; }
.empty-state { text-align: center; padding: 3rem 1rem; }
.empty-icon { font-size: 48px; display: block; margin-bottom: 1rem; }
.empty-title { font-family: 'Press Start 2P', monospace; font-size: 12px; color: var(--text-muted); margin-bottom: 0.75rem; line-height: 1.6; }
.empty-text { font-family: 'VT323', monospace; font-size: 18px; color: var(--text-dim); margin-bottom: 1.5rem; }
footer { background: #0d0d0d; border-top: 2px solid #1f1f1f; padding: 1rem 1.5rem; text-align: center; color: var(--text-dim); }
.footer-logo { font-family: 'Press Start 2P', monospace; font-size: 10px; margin-bottom: 0.3rem; }
.fl-a { color: var(--grass-light); }
.fl-s { color: var(--diamond); }
footer p { font-family: 'VT323', monospace; font-size: 14px; letter-spacing: 1px; }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Minevixel<span> Studio</span></a>
  <div class="nav-right">
    <span class="nav-user">Hey, <span id="nav-user">Creator</span></span>
    <a href="auth.html" class="nav-btn">Dashboard</a>
    <a href="create.html" class="nav-btn">+ Create</a>
    <a href="community.html" class="nav-btn">Community</a>
    <button class="nav-btn red" id="signout-btn">Sign Out</button>
  </div>
</nav>
<div class="pixel-divider"></div>

<main>
  <div class="page-title">My Addons</div>
  <div class="page-sub">All the addons you have created with Minevixel Studio</div>

  <div class="top-bar">
    <div class="addon-count" id="addon-count">Loading...</div>
    <a href="create.html" class="btn-create">+ Create New Addon</a>
  </div>

  <div id="addons-container">
    <div class="loading-msg">Loading your addons...</div>
  </div>
</main>

<div class="pixel-divider"></div>
<footer>
  <div class="footer-logo"><span class="fl-a">MINEVIXEL</span> <span class="fl-s">STUDIO</span></div>
  <p>© 2026 Minevixel Studio. All rights reserved.</p>
</footer>

<script>
var SURL = 'https://msinakayesbwqxrkzvzb.supabase.co';
var SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zaW5ha2F5ZXNid3F4cmt6dnpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNTIyOTMsImV4cCI6MjA5NDcyODI5M30.M3gj3TgdHomR4BRF5MYhJvmIyqGV7I3e1a7WCPH_vYU';
var sc = window.supabase.createClient(SURL, SKEY);
var currentUser = null;

sc.auth.getSession().then(function(res) {
  var session = res.data.session;
  if (!session) { window.location.href = 'auth.html'; return; }
  currentUser = session.user;
  var u = session.user.user_metadata && session.user.user_metadata.username ? session.user.user_metadata.username : session.user.email.split('@')[0];
  document.getElementById('nav-user').textContent = u;
  loadAddons(session.user.id);
});

document.getElementById('signout-btn').onclick = async function() {
  await sc.auth.signOut();
  window.location.href = 'auth.html';
};

async function loadAddons(userId) {
  try {
    var result = await sc.from('addons').select('*').eq('user_id', userId).order('created_at', { ascending: false });
    if (result.error) throw result.error;
    var addons = result.data || [];
    document.getElementById('addon-count').textContent = addons.length + ' addon' + (addons.length !== 1 ? 's' : '') + ' created';

    if (addons.length === 0) {
      document.getElementById('addons-container').innerHTML =
        '<div class="empty-state">' +
          '<span class="empty-icon">📦</span>' +
          '<div class="empty-title">No Addons Yet</div>' +
          '<div class="empty-text">You have not created any addons yet!</div>' +
          '<a href="create.html" class="btn-create">+ Create Your First Addon</a>' +
        '</div>';
      return;
    }

    var html = '<div class="addons-grid">';
    addons.forEach(function(addon) {
      var icon = addon.addon_type === 'mob' ? '🦎' : '🧱';
      var date = new Date(addon.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
      var colors = addon.colors || [];
      var colorDots = colors.map(function(c) { return '<div class="color-dot" style="background:' + c + ';"></div>'; }).join('');
      var isShared = addon.is_shared === true;

      html += '<div class="addon-card" id="card-' + addon.id + '">';
      html += '<span class="addon-type-icon">' + icon + '</span>';
      html += '<div class="addon-name">' + (addon.addon_name || 'Unnamed') + '</div>';
      html += '<div class="addon-desc">' + (addon.description ? addon.description.substring(0, 80) + (addon.description.length > 80 ? '...' : '') : '') + '</div>';
      html += '<div class="addon-meta">';
      html += '<span class="addon-tag">' + (addon.addon_type || 'mob') + '</span>';
      html += '<span class="addon-tag blue">' + (addon.behavior || 'Passive') + '</span>';
      html += '</div>';
      if (colors.length) html += '<div class="addon-colors">' + colorDots + '</div>';
      html += '<div class="addon-stats">';
      html += '<div class="stat-mini"><span class="stat-mini-label">HEALTH</span><span class="stat-mini-val" style="color:#e05252;">❤ ' + (addon.health || 20) + '</span></div>';
      html += '<div class="stat-mini"><span class="stat-mini-label">ATTACK</span><span class="stat-mini-val" style="color:var(--gold);">⚔ ' + (addon.attack || 4) + '</span></div>';
      html += '<div class="stat-mini"><span class="stat-mini-label">SIZE</span><span class="stat-mini-val" style="color:var(--diamond);">' + (addon.size || 'M') + '</span></div>';
      html += '</div>';
      html += '<div class="addon-date">Created ' + date + '</div>';
      html += '<div class="addon-btns">';
      html += '<button class="btn-share' + (isShared ? ' shared' : '') + '" data-id="' + addon.id + '" data-shared="' + isShared + '" onclick="toggleShare(this)">' + (isShared ? '✔ Shared' : 'Share') + '</button>';
      html += '<button class="btn-delete" data-id="' + addon.id + '" onclick="deleteAddon(this)">Delete</button>';
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';
    document.getElementById('addons-container').innerHTML = html;

  } catch (err) {
    document.getElementById('addons-container').innerHTML = '<div class="loading-msg">Error: ' + err.message + '</div>';
  }
}

async function toggleShare(btn) {
  var addonId = btn.getAttribute('data-id');
  var isShared = btn.getAttribute('data-shared') === 'true';
  var newState = !isShared;

  try {
    var result = await sc.from('addons')
      .update({ is_shared: newState })
      .eq('id', addonId)
      .eq('user_id', currentUser.id);

    if (result.error) throw result.error;

    btn.setAttribute('data-shared', newState.toString());
    btn.textContent = newState ? '✔ Shared' : 'Share';
    if (newState) {
      btn.classList.add('shared');
      alert('Addon shared to community gallery!');
    } else {
      btn.classList.remove('shared');
      alert('Addon removed from community gallery.');
    }
  } catch (err) {
    alert('Could not update: ' + err.message);
  }
}

async function deleteAddon(btn) {
  var addonId = btn.getAttribute('data-id');
  if (!confirm('Are you sure you want to delete this addon?')) return;
  try {
    var result = await sc.from('addons').delete().eq('id', addonId).eq('user_id', currentUser.id);
    if (result.error) throw result.error;
    var card = document.getElementById('card-' + addonId);
    if (card) card.remove();
    var remaining = document.querySelectorAll('.addon-card').length;
    document.getElementById('addon-count').textContent = remaining + ' addon' + (remaining !== 1 ? 's' : '') + ' created';
  } catch (err) {
    alert('Could not delete: ' + err.message);
  }
}
</script>
</body>
</html>
